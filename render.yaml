services:
  - type: web
    name: sivanta-admin-license
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    disk:
      name: sivanta-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ED25519_PRIVATE_KEY_PEM
        sync: false
